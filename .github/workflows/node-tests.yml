name: Geolocation and project tests

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/geo-provider-circuit-breaker"]

permissions:
  contents: read

jobs:
  test:
    name: Node.js tests and syntax checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.18.1"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run test suite
        run: npm test
      - name: Run syntax checks
        run: npm run check
