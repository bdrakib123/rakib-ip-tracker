name: Rebuild Atlas TLS diagnostic

on:
  workflow_dispatch:

permissions: {}

jobs:
  atlas-tls-diagnostic:
    name: IP Tracker V2 network-only TLS diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Runtime information
        shell: bash
        run: |
          set -euo pipefail
          printf 'Runner OS: %s\n' "$RUNNER_OS"
          printf 'OpenSSL: '
          openssl version
          printf 'Node.js: '
          node --version

      - name: DNS, TCP, and verified TLS diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ipaddress
          import os
          import re
          import shutil
          import socket
          import subprocess

          SRV_NAME = "_mongodb._tcp.ip-tracker.bt7lpmc.mongodb.net"
          HOSTS = [
              "ac-x0xzt6m-shard-00-00.bt7lpmc.mongodb.net",
              "ac-x0xzt6m-shard-00-01.bt7lpmc.mongodb.net",
              "ac-x0xzt6m-shard-00-02.bt7lpmc.mongodb.net",
          ]
          PORT = 27017

          def command(args, timeout=7, input_text=None):
              try:
                  return subprocess.run(args, input=input_text, text=True,
                                        stdout=subprocess.PIPE, stderr=subprocess.PIPE,
                                        timeout=timeout, check=False)
              except subprocess.TimeoutExpired:
                  return None

          def dns_srv():
              if not shutil.which("dig"):
                  print("SRV DNS: NOT TESTED (dig is unavailable)")
                  return set(), "NOT TESTED"
              result = command(["dig", "+time=3", "+tries=1", "+short", "SRV", SRV_NAME], timeout=5)
              if result is None:
                  print("SRV DNS: TIMEOUT")
                  return set(), "TIMEOUT"
              targets = set()
              records = []
              for line in result.stdout.splitlines():
                  parts = line.split()
                  if len(parts) != 4 or not parts[2].isdigit():
                      continue
                  priority, weight, port, target = parts
                  target = target.rstrip(".").lower()
                  if not re.fullmatch(r"[a-z0-9.-]+", target):
                      continue
                  records.append((target, int(port)))
                  targets.add((target, int(port)))
              if not records:
                  print("SRV DNS: FAIL (no valid SRV targets returned)")
                  return set(), "FAIL"
              print("SRV DNS: PASS")
              for target, port in records:
                  print(f"  {target}:{port}")
              return targets, "PASS"

          def dns_a(host):
              if not shutil.which("dig"):
                  return [], "NOT TESTED"
              result = command(["dig", "+time=3", "+tries=1", "+short", "A", host], timeout=5)
              if result is None:
                  return [], "TIMEOUT"
              addresses = []
              for line in result.stdout.splitlines():
                  try:
                      address = ipaddress.ip_address(line.strip())
                      if address.version == 4:
                          addresses.append(str(address))
                  except ValueError:
                      pass
              return sorted(set(addresses)), "PASS" if addresses else "FAIL"

          def tcp_test(addresses):
              if not addresses:
                  return "NOT TESTED"
              outcomes = []
              for address in addresses:
                  try:
                      with socket.create_connection((address, PORT), timeout=4):
                          outcomes.append("PASS")
                  except (socket.timeout, TimeoutError):
                      outcomes.append("TIMEOUT")
                  except OSError:
                      outcomes.append("FAIL")
              if "PASS" in outcomes:
                  return "PASS"
              if "FAIL" in outcomes:
                  return "FAIL"
              return "TIMEOUT"

          def tls_test(host, address, version):
              flag = "-tls1_2" if version == "1.2" else "-tls1_3"
              args = ["openssl", "s_client", "-connect", f"{address}:{PORT}",
                      "-servername", host, "-verify_hostname", host,
                      "-verify", "10", "-verify_return_error", "-brief", flag]
              result = command(args, timeout=10, input_text="")
              if result is None:
                  return {"status": "TIMEOUT", "peer": "NO", "protocol": "-",
                          "cipher": "-", "verify": "NOT REPORTED", "error": "TIMEOUT"}
              output = result.stdout + "\n" + result.stderr
              peer = "YES" if re.search(r"(?m)^Peer certificate:", output) else "NO"
              protocol_match = re.search(r"(?m)^Protocol version:\s*(\S+)", output)
              cipher_match = re.search(r"(?m)^Ciphersuite:\s*(\S+)", output)
              verify_match = re.search(r"(?m)^Verification:\s*(.+)$", output)
              verify_error = re.search(r"(?m)^Verification error:\s*(.+)$", output)
              protocol = protocol_match.group(1) if protocol_match else "-"
              cipher = cipher_match.group(1) if cipher_match else "-"
              verify = "OK" if verify_match and verify_match.group(1).strip() == "OK" else "FAILED/NOT REPORTED"
              if verify_error:
                  verify = "FAILED"
              lower = output.lower()
              if result.returncode == 0 and peer == "YES" and protocol != "-" and cipher != "-" and verify == "OK":
                  status, error = "PASS", "NONE"
              elif "timed out" in lower or "timeout" in lower:
                  status, error = "TIMEOUT", "TIMEOUT"
              elif "alert internal error" in lower:
                  status, error = "FAIL", "TLS_ALERT_INTERNAL_ERROR"
              elif "alert handshake failure" in lower:
                  status, error = "FAIL", "TLS_ALERT_HANDSHAKE_FAILURE"
              elif "certificate verify failed" in lower or "verification error" in lower:
                  status, error = "FAIL", "CERTIFICATE_VERIFY_FAILED"
              elif "connection refused" in lower:
                  status, error = "FAIL", "ECONNREFUSED"
              elif peer == "NO":
                  status, error = "FAIL", "NO_PEER_CERTIFICATE"
              else:
                  status, error = "FAIL", "TLS_HANDSHAKE_FAILED"
              return {"status": status, "peer": peer, "protocol": protocol,
                      "cipher": cipher, "verify": verify, "error": error}

          srv_targets, srv_status = dns_srv()
          rows = []
          for host in HOSTS:
              addresses, a_status = dns_a(host)
              srv_member = (host, PORT) in srv_targets
              if srv_status != "PASS":
                  dns_status = srv_status
              elif not srv_member:
                  dns_status = "FAIL"
              else:
                  dns_status = a_status
              if a_status == "PASS":
                  print(f"A {host}: PASS ({', '.join(addresses)})")
              elif a_status == "TIMEOUT":
                  print(f"A {host}: TIMEOUT")
              elif a_status == "NOT TESTED":
                  print(f"A {host}: NOT TESTED")
              else:
                  print(f"A {host}: FAIL (no IPv4 addresses)")
              tcp = tcp_test(addresses)
              print(f"TCP {host}:{PORT}: {tcp}")
              tls12 = tls_test(host, addresses[0], "1.2") if addresses else {
                  "status": "NOT TESTED", "peer": "NO", "protocol": "-",
                  "cipher": "-", "verify": "NOT TESTED", "error": "DNS_UNAVAILABLE"}
              tls13 = tls_test(host, addresses[0], "1.3") if addresses else {
                  "status": "NOT TESTED", "peer": "NO", "protocol": "-",
                  "cipher": "-", "verify": "NOT TESTED", "error": "DNS_UNAVAILABLE"}
              for version, info in (("1.2", tls12), ("1.3", tls13)):
                  print(f"TLS {version} {host}: {info['status']} peer_cert={info['peer']} "
                        f"protocol={info['protocol']} cipher={info['cipher']} "
                        f"verification={info['verify']} error={info['error']}")
              rows.append((host, dns_status, tcp, tls12["status"], tls13["status"], tls12, tls13))

          summary = [
              "## Atlas TLS connectivity diagnostic (network-only)",
              "",
              f"SRV query `{SRV_NAME}`: **{srv_status}**",
              "",
              "| Host | DNS (SRV + A) | TCP 27017 | TLS 1.2 | TLS 1.3 |",
              "|---|---|---|---|---|",
          ]
          for host, dns, tcp, tls12_status, tls13_status, _, _ in rows:
              summary.append(f"| `{host}` | {dns} | {tcp} | {tls12_status} | {tls13_status} |")
          summary += [
              "",
              "TLS details (peer certificate, protocol, cipher, verification, sanitized error code) are in the job log.",
              "",
              "> **Atlas allowlist limitation:** GitHub-hosted runner IPs are dynamic and may not be on the Atlas Network Access list. Any TLS failure is therefore inconclusive as to Atlas IP filtering versus endpoint/network TLS behavior. This workflow does not alter the allowlist or bypass it.",
              "",
              "This job performs DNS, TCP, and TLS-only checks. It does not use a MongoDB driver, authenticate, or issue database commands.",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write("\n".join(summary) + "\n")
          PY
